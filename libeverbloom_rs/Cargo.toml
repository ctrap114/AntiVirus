[package]
name = "libeverbloom_rs"
version = "0.1.0"
edition = "2021"
description = "Rust performance core for EverbloomSecurity with PyO3 bindings."
license = "MIT OR Apache-2.0"

[lib]
name = "libeverbloom_rs"
crate-type = ["cdylib"]

[dependencies]
everbloom_engine = { path = "../engine" }
pyo3 = { version = "0.29", features = ["extension-module", "auto-initialize"] }
rayon = "1.7"
pelite = "0.10"
aho-corasick = "1.1"
lru = "0.8"
parking_lot = "0.12"
memmap2 = "0.9"
notify = "6.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
flume = "0.11"
windows = { version = "0.48", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_System_Diagnostics_Etw"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemServices"] }
sandbox_monitor = { path = "../sandbox_monitor" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tempfile = "3.5"
yara = { version = "0.32", optional = true, default-features = false, features = ["vendored", "bundled-4_5_5", "ndebug"] }

[features]
default = ["with_yara"]
with_yara = ["yara"]
