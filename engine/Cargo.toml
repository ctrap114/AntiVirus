[package]
name = "everbloom_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
arc-swap = "1.7"
rayon = "1.7"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
getrandom = "0.2"
thiserror = "1.0"
log = "0.4"
hex = "0.4"
dashmap = "5.5"
csv = "1.3"
rusqlite = { version = "0.31", features = ["bundled"] }
yara = { version = "0.32", default-features = false, features = ["vendored", "bundled-4_5_5", "ndebug"] }
libc = "0.2"
goblin = "0.7"
tract-onnx = "0.23.4"
prost = "0.11"
bytes = "1.4"
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.3"
tempfile = "3.5"
lazy_static = "1.4"
nix = "0.27"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Antimalware", "Win32_System_Com", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_Time", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.5"
