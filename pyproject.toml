[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "EverbloomSecurity"
version = "0.1.0"
description = "EverbloomSecurity - research antivirus with local heuristic and ONNX engines"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pydantic>=2.10,<3",
    "yara-python>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "numpy>=1.24"]
quality = ["pytest>=8,<9", "numpy>=1.24", "onnxruntime>=1.16"]
ml = [
    "numpy>=1.24",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "torch>=2.0",
    "scikit-learn>=1.2",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["everbloom_config*", "everbloom_core*", "everbloom_viz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".venv",
    "build",
    "build-*",
    "engine/target",
    "libeverbloom_rs/target",
    "sandbox_monitor/target",
    "vcpkg",
]
