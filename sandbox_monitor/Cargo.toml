[package]
name = "sandbox_monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = "0.30"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_System_Threading", "Win32_System_SystemServices"] }
